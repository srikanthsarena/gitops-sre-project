apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: order-service
          image: ghcr.io/srikanthsarena/gitops-sre-project/order-service:2afca5639ece03ce0081690d5183757bb0109342
          ports:
            - containerPort: 8000
