apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gitops-apps
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.gitops-apps.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/alerts.rules.yml

    scrape_configs:
      - job_name: "user-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - user-service.gitops-apps.svc.cluster.local:8000

      - job_name: "order-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - order-service.gitops-apps.svc.cluster.local:8000
