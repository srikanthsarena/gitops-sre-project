apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gitops-apps
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.rules.yml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

  alerts.rules.yml: |
    groups:
      - name: service-alerts
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "Prometheus target {{ $labels.instance }} is down"
