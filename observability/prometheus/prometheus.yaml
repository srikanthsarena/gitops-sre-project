global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service.gitops-apps.svc.cluster.local:8000"]

  - job_name: "order-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service.gitops-apps.svc.cluster.local:8000"]
