apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gitops-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        day-19-force-rollout: "true"
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true

        - name: configmap-reload
          image: jimmidyson/configmap-reload:v0.12.0
          args:
            - --volume-dir=/etc/prometheus
            - --webhook-url=http://127.0.0.1:9090/-/reload
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
