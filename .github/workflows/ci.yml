name: CI

on:
  push:
    branches: [ main ]
    # 🔒 CRITICAL: only run CI when application code changes
    paths:
      - "apps/**"
      - "policy/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "policy/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: srikanthsarena/gitops-sre-project

jobs:
  build-and-push:
    # Extra safety: ignore image updater commits even if paths misfire
    if: github.actor != 'argocd-image-updater'
    name: Build and Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [user-service, order-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG from commit SHA
        run: echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  trivy-scan:
    if: github.actor != 'argocd-image-updater'
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    strategy:
      matrix:
        service: [user-service, order-service]

    steps:
      - name: Set IMAGE_TAG from commit SHA
        run: echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_ENV

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 1

  policy-check:
    if: github.actor != 'argocd-image-updater'
    name: OPA Policy Check
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.52.0/conftest_0.52.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.52.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run OPA policy checks
        run: conftest test gitops/apps --policy policy/kubernetes
