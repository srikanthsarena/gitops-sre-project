name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "apps/**"
      - "policy/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "policy/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: srikanthsarena/gitops-sre-project

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG from commit SHA
        run: echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
      - name: Set IMAGE_TAG from commit SHA
        run: echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_ENV

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          # ✅ pick ONE:
          # Option 1: CRITICAL only (recommended)
          severity: CRITICAL
          exit-code: 1
          # Optional: speed up by disabling secret scanning noise
          scanners: vuln
          hide-progress: true

  policy-check:
    name: Policy Lint (Rego)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          set -e
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: OPA format check
        run: |
          opa fmt --fail -w policy/kubernetes
