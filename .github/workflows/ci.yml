name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: srikanthsarena/gitops-sre-project

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install flake8 pytest
          pip install -r apps/user-service/requirements.txt
          pip install -r apps/order-service/requirements.txt

      - name: Run flake8
        run: |
          flake8 apps || true

      - name: Run tests
        run: |
          pytest || true

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: lint-test

    strategy:
      matrix:
        service: [user-service, order-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    strategy:
      matrix:
        service: [user-service, order-service]

    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH

  policy-check:
    name: OPA Policy Check
    runs-on: ubuntu-latest
    needs: build-and-push
          docker push $IMAGE_NAME:${{ github.sha }}

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    strategy:
      matrix:
        service: [user-service, order-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.52.0/conftest_0.52.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.52.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run OPA policy checks
        run: |
          conftest test gitops/apps --policy policy/kubernetes
      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ghcr.io/srikanthsarena/gitops-sre-project/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH
  
